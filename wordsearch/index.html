<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Word Search</title>
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #00229e; }
        #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
                   color: white; font-family: sans-serif; font-size: 20px; text-align: center; padding: 16px; }
    </style>
</head>
<body>
<div id="loading">Loading…</div>
<script>
    var UNSUPPORTED = "This browser is not supported. Please use a recent version of Safari or Chrome.";
    // The app draws with WebGL2. Without it the page would stay blank, so say so and do not load the app.
    var canvas = document.createElement("canvas");
    var hasWebGl2 = false;
    try { hasWebGl2 = !!canvas.getContext("webgl2"); } catch (e) { hasWebGl2 = false; }
    if (!hasWebGl2) {
        document.getElementById("loading").textContent = UNSUPPORTED;
    } else {
        // main() removes #loading once the app runs; if it is still there, this browser cannot run the app.
        setTimeout(function () {
            var el = document.getElementById("loading");
            if (el) el.textContent = UNSUPPORTED;
        }, 20000);
        var script = document.createElement("script");
        script.src = "wordsearch.js";
        document.body.appendChild(script);
    }
</script>
</body>
</html>
